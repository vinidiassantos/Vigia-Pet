<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIGIA PET</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header com Avatar do Pet -->
        <header>
            <div class="logo">
                <span class="logo-text">VIGIA PE</span>
                <span class="logo-t">
                    T
                    <svg class="logo-rays" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 2v4M6 4l2.5 2.5M18 4l-2.5 2.5" />
                    </svg>
                </span>
            </div>
            <div class="header-right">
                <div class="pet-avatar">
                    <!-- Usando um ícone de pata como placeholder, você pode trocar por uma foto real -->
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9.5 2 7.5 4 7.5 6.5c0 1 .5 2 1 3-.5.5-1 1.5-1 2.5 0 2 1.5 3.5 3.5 3.5s3.5-1.5 3.5-3.5c0-1-.5-2-1-2.5.5-1 1-2 1-3C15 4 13.5 2 12 2zm-4 10c-1.5 0-2.5 1.5-2.5 3s1 3 2.5 3 2.5-1.5 2.5-3-1-3-2.5-3zm8 0c-1.5 0-2.5 1.5-2.5 3s1 3 2.5 3 2.5-1.5 2.5-3-1-3-2.5-3z"/></svg>
                </div>
                <div class="status" id="connectionStatus">
                    <span class="status-dot"></span> ONLINE
                </div>
            </div>
        </header>

        <!-- Área da Câmera com Borda Gradiente -->
        <div class="camera-wrapper">
            <div class="camera-area active" id="cameraArea">
                <video id="video" autoplay playsinline muted></video>
                <div class="timer-overlay" id="timerOverlay" style="display: none;">
                    <div class="timer-ring"><span id="timerDisplay">30</span></div>
                </div>
                <div class="overlay" id="behaviorOverlay">
                    <span class="behavior-text" id="behaviorText">AGUARDANDO</span>
                </div>
            </div>
        </div>

        <!-- Botão Principal -->
        <button id="vigiarBtn" class="btn-primary">
            VIGIAR
        </button>

        <!-- Controles de Gravação -->
        <div class="controls-row" id="controlsRow" style="display: none;">
            <button id="pauseBtn" class="btn-secondary">PAUSAR</button>
            <button id="stopBtn" class="btn-secondary">ENCERRAR</button>
        </div>

        <!-- Blocos de Estatísticas (Lado a Lado) -->
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="stat-icon sleep">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm0 16a7 7 0 1 1 7-7 7 7 0 0 1-7 7z"/></svg>
                </div>
                <span class="stat-label">DESCANSO</span>
                <span class="stat-value" id="sleepTime">0m</span>
            </div>
            <div class="stat-card">
                <div class="stat-icon eat">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 4h12v2H6V4zm0 4h12v2H6V8zm0 4h12v2H6v-2zm0 4h12v2H6v-2z"/></svg>
                </div>
                <span class="stat-label">ALIMENTAÇÃO</span>
                <span class="stat-value" id="eatTime">0m</span>
            </div>
            <div class="stat-card">
                <div class="stat-icon active">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <span class="stat-label">ATIVIDADE</span>
                <span class="stat-value" id="activeTime">0m</span>
            </div>
        </div>

        <!-- Relatório da IA em Destaque (Card Verde Suave) -->
        <div class="ia-respostas" id="iaRespostasContainer">
            <div class="ia-header">
                <h3>RELATÓRIO DA IA</h3>
                <span class="ia-badge" id="iaCategoryBadge" style="display: none;">ANÁLISE</span>
            </div>
            <ul id="iaList">
                <li class="ia-item placeholder">Aguardando início da vigília...</li>
            </ul>
        </div>

        <!-- Feedback do Cliente -->
        <div class="feedback-container" id="feedbackContainer" style="display: none;">
            <p class="feedback-title">A IA acertou o comportamento do seu pet?</p>
            <div class="feedback-buttons" id="feedbackButtons">
                <button id="btnCorrect" class="btn-feedback correct">👍 Sim</button>
                <button id="btnIncorrect" class="btn-feedback incorrect">👎 Não</button>
            </div>
            <div class="feedback-comment-box" id="feedbackCommentBox" style="display: none;">
                <input type="text" id="feedbackComment" placeholder="O que a IA errou?">
                <button id="btnSendFeedback" class="btn-send-feedback">Enviar</button>
            </div>
            <p class="feedback-thanks" id="feedbackThanks" style="display: none;">Obrigado pelo seu feedback! 🐾</p>
        </div>

        <!-- Ações Inferiores -->
        <div class="bottom-actions">
            <button id="historyBtn" class="btn-secondary">HISTÓRICO</button>
            <button id="whatsappBtn" class="btn-secondary btn-whatsapp">COMPARTILHAR</button>
        </div>

        <!-- Modal de Histórico -->
        <div id="historyModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-modal" id="closeModal">&times;</span>
                <h3>HISTÓRICO</h3>
                <ul id="historyList"></ul>
            </div>
        </div>

        <canvas id="canvas" style="display: none;"></canvas>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
