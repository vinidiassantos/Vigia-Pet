<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGIA PET - Monitor de Pets</title>
    <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">`n</head>
<body>
    <div id="app">
        <header>
            <div class="logo">?? VIGIA PET</div>
            <div class="status" id="connectionStatus">? Online</div>
        </header>
        <main>
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <div class="overlay" id="behaviorOverlay">
                    <span class="behavior-icon" id="behaviorIcon">??</span>
                    <span class="behavior-text" id="behaviorText">Aguardando...</span>
                </div>
            </div>
            <div class="controls">
                <button id="startBtn" class="btn-primary">? Iniciar Monitoramento</button>
                <button id="stopBtn" class="btn-secondary" disabled>? Parar</button>
                <button id="historyBtn" class="btn-secondary">?? Hist¢rico</button>
                <button id="exportBtn" class="btn-secondary">?? Exportar</button>
            </div>
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <span class="stat-label">?? Descanso</span>
                    <span class="stat-value" id="sleepTime">0h 0m</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">?? Alimenta‡Æo</span>
                    <span class="stat-value" id="eatTime">0h 0m</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">?? Atividade</span>
                    <span class="stat-value" id="activeTime">0h 0m</span>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
