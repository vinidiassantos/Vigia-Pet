<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIGIA PET</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo">🐾 VIGIA PET</div>
            <div class="status" id="connectionStatus">● Conectado</div>
        </header>

        <!-- Conteúdo Principal -->
        <main>
            <!-- Área da Câmera (oculta até iniciar) -->
            <div class="camera-area" id="cameraArea" style="display:none;">
                <video id="video" autoplay playsinline></video>
                <div class="camera-overlay">
                    <span id="behaviorIcon">🔍</span>
                    <span id="behaviorText">Analisando...</span>
                </div>
            </div>

            <!-- Botão Vigiar (CENTRAL) -->
            <div class="vigiar-container">
                <button id="vigiarBtn" class="btn-vigiar">
                    <span class="icon">📷</span>
                    <span class="text">VIGIAR</span>
                </button>
                <p class="status-text" id="statusText">Toque para começar a vigiar</p>
            </div>

            <!-- Estatísticas Rápidas -->
            <div class="stats-mini">
                <div class="stat-item">
                    <span class="stat-emoji">😴</span>
                    <span class="stat-label">Descanso</span>
                    <span class="stat-value" id="sleepTime">0h 0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-emoji">🍖</span>
                    <span class="stat-label">Alimentação</span>
                    <span class="stat-value" id="eatTime">0h 0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-emoji">🐕</span>
                    <span class="stat-label">Atividade</span>
                    <span class="stat-value" id="activeTime">0h 0m</span>
                </div>
            </div>

            <!-- Ações Secundárias -->
            <div class="actions">
                <button id="historyBtn" class="btn-secondary">📊 Histórico</button>
                <button id="exportBtn" class="btn-secondary">📤 Exportar</button>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
