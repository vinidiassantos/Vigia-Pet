<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIGIA PET</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-text">VIGIA PE</span>
                <span class="logo-t">
                    T
                    <svg class="logo-rays" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 2v4M6 4l2.5 2.5M18 4l-2.5 2.5" />
                    </svg>
                </span>
            </div>
            <div class="status" id="connectionStatus">
                <span class="status-dot"></span> ONLINE
            </div>
        </header>

        <!-- Área da Câmera -->
        <div class="camera-area active" id="cameraArea">
            <video id="video" autoplay playsinline muted></video>
            
            <!-- Timer de Gravação -->
            <div class="timer-overlay" id="timerOverlay" style="display: none;">
                <div class="timer-ring">
                    <span id="timerDisplay">30</span>
                </div>
            </div>
            
            <!-- Status Overlay -->
            <div class="overlay" id="behaviorOverlay">
                <span class="behavior-text" id="behaviorText">AGUARDANDO</span>
            </div>
        </div>

        <!-- Botão Principal -->
        <button id="vigiarBtn" class="btn-primary">
            INICIAR VIGÍLIA
        </button>

        <!-- Controles de Gravação -->
        <div class="controls-row" id="controlsRow" style="display: none;">
            <button id="pauseBtn" class="btn-secondary">PAUSAR</button>
            <button id="stopBtn" class="btn-secondary">ENCERRAR</button>
        </div>

        <!-- Blocos de Estatísticas -->
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">DESCANSO</span>
                    <span class="stat-value" id="sleepTime">0m</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="sleepBar" style="width: 0%;"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">ALIMENTAÇÃO</span>
                    <span class="stat-value" id="eatTime">0m</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="eatBar" style="width: 0%;"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">ATIVIDADE</span>
                    <span class="stat-value" id="activeTime">0m</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="activeBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- Dicas da IA -->
        <div class="ia-respostas">
            <div class="ia-header">
                <h3>RELATÓRIO DA IA</h3>
                <span class="ia-badge" id="iaCategoryBadge" style="display: none;">ANÁLISE</span>
            </div>
            <ul id="iaList">
                <li class="ia-item placeholder">Aguardando início da vigília.</li>
            </ul>
        </div>

        <!-- Botões de Ação -->
        <div class="bottom-actions">
            <button id="historyBtn" class="btn-secondary">HISTÓRICO</button>
            <button id="whatsappBtn" class="btn-secondary">COMPARTILHAR</button>
        </div>

        <!-- Modal de Histórico -->
        <div id="historyModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-modal" id="closeModal">&times;</span>
                <h3>HISTÓRICO</h3>
                <ul id="historyList"></ul>
            </div>
        </div>

        <canvas id="canvas" style="display: none;"></canvas>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
