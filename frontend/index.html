<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIGIA PET</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">🐾</span>
                <span class="logo-text">VIGIA PET</span>
            </div>
            <div class="status" id="connectionStatus">🟢 Online</div>
        </header>

        <!-- Área da Câmera -->
        <div class="camera-area" id="cameraArea">
            <video id="video" autoplay playsinline></video>
            <!-- Canvas invisível para captura do frame da imagem da câmera -->
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="overlay" id="behaviorOverlay">
                <span class="behavior-icon" id="behaviorIcon">🔍</span>
                <span class="behavior-text" id="behaviorText">Aguardando...</span>
            </div>
        </div>

        <!-- Botão VIGIAR (Ação Direta da Câmera) -->
        <div style="margin: 20px 0; text-align: center;">
            <button id="vigiarBtn" class="vigiar-btn" type="button" style="width: 100%;">
                <span class="icon">📷</span>
                <span id="btn-text" class="text">VIGIAR / ANALISAR</span>
            </button>
        </div>

        <!-- Estatísticas -->
        <div class="stats">
            <div class="stat-card">
                <span class="stat-icon">😴</span>
                <span class="stat-label">Descanso</span>
                <span class="stat-value" id="sleepTime">0h 0m</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🍖</span>
                <span class="stat-label">Alimentação</span>
                <span class="stat-value" id="eatTime">0h 0m</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🐕</span>
                <span class="stat-label">Atividade</span>
                <span class="stat-value" id="activeTime">0h 0m</span>
            </div>
        </div>

        <!-- Respostas da IA (Dicas em destaque) -->
        <div class="ia-respostas">
            <h3>🤖 Dicas da IA</h3>
            <ul id="iaList">
                <li class="ia-item">💡 Clique em VIGIAR para analisar o pet pela câmera...</li>
                <li class="ia-item">💡 Aponte a câmera para o seu animal</li>
                <li class="ia-item">💡 O Gemini identificará o comportamento automaticamente</li>
            </ul>
        </div>

        <!-- Bloco para exibir o diagnóstico detalhado retornado pelo Gemini -->
        <div id="result-container" class="card hidden" style="margin-top: 15px;">
            <h3>Análise Detalhada</h3>
            <div id="result-content" class="result-text" style="white-space: pre-wrap; margin-top: 10px;"></div>
        </div>

        <!-- Botões Inferiores -->
        <div class="bottom-actions" style="margin-top: 15px;">
            <button id="historyBtn" class="action-btn">📊 Histórico</button>
            <button id="exportBtn" class="action-btn primary">📤 Enviar</button>
        </div>
    </div>

    <!-- Script principal importado como módulo JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
