<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIGIA PET</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">🐾</span>
                <span class="logo-text">VIGIA PET</span>
            </div>
            <div class="status" id="connectionStatus">🟢 Online</div>
        </header>

        <!-- Área da Câmera -->
        <div class="camera-area" id="cameraArea">
            <video id="video" autoplay playsinline></video>
            <div class="overlay" id="behaviorOverlay">
                <span class="behavior-icon" id="behaviorIcon">🔍</span>
                <span class="behavior-text" id="behaviorText">Aguardando...</span>
            </div>
        </div>

        <!-- Formulário de Envio para Análise do Gemini -->
        <form id="gemini-form" class="card" style="margin: 15px 0;">
            <label for="prompt-input" style="display:block; font-weight:bold; margin-bottom: 5px;">
                Descreva ou observe o pet:
            </label>
            <textarea 
                id="prompt-input" 
                placeholder="Ex: O pet está agitado, latindo para a porta..." 
                rows="3" 
                style="width: 100%; box-sizing: border-box; padding: 8px;"
                required
            ></textarea>

            <label for="media-input" style="display:block; font-weight:bold; margin: 10px 0 5px;">
                Anexar foto/vídeo (Opcional):
            </label>
            <input type="file" id="media-input" accept="image/*,video/*" style="margin-bottom: 10px;">

            <!-- Botão VIGIAR (Grande) / Submeter para IA -->
            <button id="vigiarBtn" type="submit" class="vigiar-btn">
                <span class="icon">📷</span>
                <span id="btn-text" class="text">VIGIAR / ANALISAR</span>
            </button>
        </form>

        <!-- Estatísticas -->
        <div class="stats">
            <div class="stat-card">
                <span class="stat-icon">😴</span>
                <span class="stat-label">Descanso</span>
                <span class="stat-value" id="sleepTime">0h 0m</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🍖</span>
                <span class="stat-label">Alimentação</span>
                <span class="stat-value" id="eatTime">0h 0m</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🐕</span>
                <span class="stat-label">Atividade</span>
                <span class="stat-value" id="activeTime">0h 0m</span>
            </div>
        </div>

        <!-- Respostas da IA (Lista de Dicas) -->
        <div class="ia-respostas">
            <h3>🤖 Dicas da IA</h3>
            <ul id="iaList">
                <li class="ia-item">💡 Aguardando dados para gerar dicas...</li>
                <li class="ia-item">💡 Monitore o comportamento do pet</li>
                <li class="ia-item">💡 As dicas aparecerão aqui</li>
            </ul>
        </div>

        <!-- Opcional: Bloco para exibir o texto completo retornado pelo Gemini -->
        <div id="result-container" class="card hidden" style="margin-top: 15px;">
            <h3>Análise Detalhada</h3>
            <div id="result-content" class="result-text" style="white-space: pre-wrap; margin-top: 10px;"></div>
        </div>

        <!-- Botões Inferiores -->
        <div class="bottom-actions" style="margin-top: 15px;">
            <button id="historyBtn" class="action-btn">📊 Histórico</button>
            <button id="exportBtn" class="action-btn primary">📤 Enviar</button>
        </div>
    </div>

    <!-- Script principal importado como módulo JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
